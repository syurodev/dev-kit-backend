services:
  keycloak-db:
    image: postgres:18-alpine
    container_name: devkit-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  devkit-db:
    image: postgres:18-alpine
    container_name: devkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEVKIT_DB_NAME:-devkit}
      POSTGRES_USER: ${DEVKIT_DB_USER:-devkit}
      POSTGRES_PASSWORD: ${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_PASSWORD in .env}
    ports:
      - "${DEVKIT_DB_PORT:-5433}:5432"
    volumes:
      - devkit-db-data:/var/lib/postgresql
    networks:
      - devkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: devkit-keycloak
    restart: unless-stopped
    command: ["start"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME in .env}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    networks:
      - keycloak-network
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-1536m}
    cpus: ${KEYCLOAK_CPUS:-1.0}

volumes:
  keycloak-db-data:
  devkit-db-data:

networks:
  keycloak-network:
    driver: bridge
  devkit-network:
    driver: bridge
