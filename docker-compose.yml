x-postgres-image: &postgres-image
  image: devkit-postgres:18-alpine-hardened
  build:
    context: .
    dockerfile: Dockerfile.postgres

services:
  keycloak-db:
    <<: *postgres-image
    container_name: devkit-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  devkit-db:
    <<: *postgres-image
    container_name: devkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEVKIT_DB_NAME:-devkit}
      POSTGRES_USER: ${DEVKIT_DB_ADMIN_USER:-${DEVKIT_DB_USER:-devkit_owner}}
      POSTGRES_PASSWORD: ${DEVKIT_DB_ADMIN_PASSWORD:-${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_ADMIN_PASSWORD in .env}}
    ports:
      - "127.0.0.1:${DEVKIT_DB_PORT:-5433}:5432"
    volumes:
      - devkit-db-data:/var/lib/postgresql
    networks:
      - devkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  devkit-db-role-init:
    <<: *postgres-image
    restart: "no"
    depends_on:
      devkit-db:
        condition: service_healthy
    environment:
      DEVKIT_DB_HOST: devkit-db
      DEVKIT_DB_NAME: ${DEVKIT_DB_NAME:-devkit}
      DEVKIT_DB_ADMIN_USER: ${DEVKIT_DB_ADMIN_USER:-${DEVKIT_DB_USER:-devkit_owner}}
      DEVKIT_DB_ADMIN_PASSWORD: ${DEVKIT_DB_ADMIN_PASSWORD:-${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_ADMIN_PASSWORD in .env}}
      DEVKIT_DB_APP_USER: ${DEVKIT_DB_APP_USER:-devkit_app}
      DEVKIT_DB_APP_PASSWORD: ${DEVKIT_DB_APP_PASSWORD:-${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_APP_PASSWORD in .env}}
    entrypoint: ["/bin/sh", "/scripts/bootstrap-devkit-db-role.sh"]
    volumes:
      - ./scripts/bootstrap-devkit-db-role.sh:/scripts/bootstrap-devkit-db-role.sh:ro
    networks:
      - devkit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    image: devkit-keycloak:26.7.1-hardened
    container_name: devkit-keycloak
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-devkit.json:/opt/keycloak/data/import/realm-devkit.json:ro
    networks:
      - keycloak-network
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-1536m}
    cpus: ${KEYCLOAK_CPUS:-1.0}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data/transaction-logs:size=64m,mode=0700,uid=1000,gid=0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway-key-init:
    image: alpine:3.23
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/stage-gateway-keypair.sh"]
    volumes:
      - ${DEVKIT_GATEWAY_SIGNING_KEY_DIR:-./.local/gateway-keys}:/source:ro
      - gateway-key-data:/target
      - ./scripts/stage-gateway-keypair.sh:/scripts/stage-gateway-keypair.sh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    image: devkit-redis:8.8.1-hardened
    container_name: devkit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DEVKIT_REDIS_PASSWORD:?Set DEVKIT_REDIS_PASSWORD in .env}
    # Cache-only: no persistence or published port on the private sync network.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${DEVKIT_REDIS_PASSWORD:?Set DEVKIT_REDIS_PASSWORD in .env}
    networks:
      - sync-private-network
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  devkit-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      devkit-db-role-init:
        condition: service_completed_successfully
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DEVKIT_RETENTION_ENABLED: "false"
      DEVKIT_DB_URL: jdbc:postgresql://devkit-db:5432/${DEVKIT_DB_NAME:-devkit}
      DEVKIT_DB_USER: ${DEVKIT_DB_ADMIN_USER:-${DEVKIT_DB_USER:-devkit_owner}}
      DEVKIT_DB_PASSWORD: ${DEVKIT_DB_ADMIN_PASSWORD:-${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_ADMIN_PASSWORD in .env}}
      DEVKIT_GATEWAY_ISSUER: http://migration.invalid
      DEVKIT_GATEWAY_JWK_SET_URI: http://migration.invalid/jwks
      DEVKIT_GATEWAY_AUDIENCE: devkit-sync-api
      DEVKIT_KEYCLOAK_ISSUER: http://migration.invalid/realms/devkit
    networks:
      - devkit-network
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  devkit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devkit-api
    restart: unless-stopped
    depends_on:
      devkit-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DEVKIT_REDIS_HOST: redis
      DEVKIT_REDIS_PORT: 6379
      DEVKIT_REDIS_PASSWORD: ${DEVKIT_REDIS_PASSWORD:?Set DEVKIT_REDIS_PASSWORD in .env}
      DEVKIT_DB_URL: jdbc:postgresql://devkit-db:5432/${DEVKIT_DB_NAME:-devkit}
      DEVKIT_DB_USER: ${DEVKIT_DB_APP_USER:-devkit_app}
      DEVKIT_DB_PASSWORD: ${DEVKIT_DB_APP_PASSWORD:-${DEVKIT_DB_PASSWORD:?Set DEVKIT_DB_APP_PASSWORD in .env}}
      SPRING_LIQUIBASE_ENABLED: "false"
      DEVKIT_SERVER_ADDRESS: 0.0.0.0
      DEVKIT_SERVER_PORT: 8080
      DEVKIT_GATEWAY_ISSUER: ${DEVKIT_GATEWAY_ISSUER:-http://localhost:8082}
      DEVKIT_GATEWAY_JWK_SET_URI: http://devkit-gateway:8080/.well-known/jwks.json
      DEVKIT_GATEWAY_AUDIENCE: ${DEVKIT_GATEWAY_AUDIENCE:-devkit-sync-api}
      DEVKIT_KEYCLOAK_ISSUER: ${DEVKIT_KEYCLOAK_ISSUER:-http://localhost:8081/realms/devkit}
      DEVKIT_DEVICE_ENROLLMENT_TTL: ${DEVKIT_DEVICE_ENROLLMENT_TTL:-10m}
      DEVKIT_SYNC_MAX_OPERATIONS: ${DEVKIT_SYNC_MAX_OPERATIONS:-1000000}
      DEVKIT_SYNC_MAX_BYTES: ${DEVKIT_SYNC_MAX_BYTES:-10737418240}
      DEVKIT_RETENTION_ENABLED: ${DEVKIT_RETENTION_ENABLED:-true}
      DEVKIT_AUDIT_RETENTION: ${DEVKIT_AUDIT_RETENTION:-90d}
      DEVKIT_RETENTION_CRON: ${DEVKIT_RETENTION_CRON:-0 15 3 * * *}
    networks:
      - devkit-network
      - sync-private-network
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  devkit-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: devkit-gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      devkit-api:
        condition: service_started
      gateway-key-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DEVKIT_REDIS_HOST: redis
      DEVKIT_REDIS_PORT: 6379
      DEVKIT_REDIS_PASSWORD: ${DEVKIT_REDIS_PASSWORD:?Set DEVKIT_REDIS_PASSWORD in .env}
      DEVKIT_GATEWAY_SERVER_ADDRESS: 0.0.0.0
      DEVKIT_GATEWAY_SERVER_PORT: 8080
      DEVKIT_BACKEND_URL: http://devkit-api:8080
      DEVKIT_KEYCLOAK_ISSUER: ${DEVKIT_KEYCLOAK_ISSUER:-http://localhost:8081/realms/devkit}
      DEVKIT_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devkit/protocol/openid-connect/certs
      DEVKIT_KEYCLOAK_AUDIENCE: ${DEVKIT_KEYCLOAK_AUDIENCE:-devkit-sync-gateway}
      DEVKIT_GATEWAY_ISSUER: ${DEVKIT_GATEWAY_ISSUER:-http://localhost:8082}
      DEVKIT_GATEWAY_AUDIENCE: ${DEVKIT_GATEWAY_AUDIENCE:-devkit-sync-api}
      DEVKIT_GATEWAY_TOKEN_TTL: ${DEVKIT_GATEWAY_TOKEN_TTL:-45s}
      DEVKIT_GATEWAY_SIGNING_KEY_ID: ${DEVKIT_GATEWAY_SIGNING_KEY_ID:-devkit-gateway-local}
      DEVKIT_GATEWAY_SIGNING_PRIVATE_KEY_PATH: /run/secrets/devkit-gateway/private.pem
      DEVKIT_GATEWAY_SIGNING_PUBLIC_KEY_PATH: /run/secrets/devkit-gateway/public.pem
      DEVKIT_GATEWAY_IP_REQUESTS_PER_MINUTE: ${DEVKIT_GATEWAY_IP_REQUESTS_PER_MINUTE:-120}
      DEVKIT_GATEWAY_SUBJECT_REQUESTS_PER_MINUTE: ${DEVKIT_GATEWAY_SUBJECT_REQUESTS_PER_MINUTE:-300}
      DEVKIT_GATEWAY_MAX_CONCURRENT_REQUESTS: ${DEVKIT_GATEWAY_MAX_CONCURRENT_REQUESTS:-64}
      DEVKIT_GATEWAY_MAX_TRACKED_KEYS: ${DEVKIT_GATEWAY_MAX_TRACKED_KEYS:-10000}
    ports:
      - "127.0.0.1:${DEVKIT_GATEWAY_PORT:-8082}:8080"
    volumes:
      - gateway-key-data:/run/secrets/devkit-gateway:ro
    networks:
      - keycloak-network
      - sync-private-network
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  keycloak-db-data:
  devkit-db-data:
  gateway-key-data:

networks:
  keycloak-network:
    driver: bridge
  devkit-network:
    driver: bridge
  sync-private-network:
    driver: bridge
