spring:
  application:
    name: dev-kit
  datasource:
    url: ${DEVKIT_DB_URL:}
    username: ${DEVKIT_DB_USER:}
    password: ${DEVKIT_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${DEVKIT_SERVER_ADDRESS:127.0.0.1}
  port: ${DEVKIT_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

devkit:
  identity:
    enrollment:
      lifetime: ${DEVKIT_DEVICE_ENROLLMENT_TTL:10m}
  security:
    issuer: ${DEVKIT_GATEWAY_ISSUER:}
    jwk-set-uri: ${DEVKIT_GATEWAY_JWK_SET_URI:}
    audience: ${DEVKIT_GATEWAY_AUDIENCE:devkit-sync-api}
    upstream-issuer: ${DEVKIT_KEYCLOAK_ISSUER:}
  sync:
    quota:
      max-operations: ${DEVKIT_SYNC_MAX_OPERATIONS:1000000}
      max-bytes: ${DEVKIT_SYNC_MAX_BYTES:10737418240}
  retention:
    enabled: ${DEVKIT_RETENTION_ENABLED:true}
    audit-lifetime: ${DEVKIT_AUDIT_RETENTION:90d}
    cron: "${DEVKIT_RETENTION_CRON:0 15 3 * * *}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
