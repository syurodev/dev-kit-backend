name: Publish DevKit API image

on:
  push:
    branches: [main]
    paths:
      # API-specific source and its image definition.
      - 'src/**'
      - 'Dockerfile'
      # Both applications use the same Gradle wrapper/build configuration.
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - '.dockerignore'
      - '.github/workflows/publish-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-kit-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dev-kit-api:main
          cache-from: type=gha,scope=dev-kit-api
          cache-to: type=gha,mode=max,scope=dev-kit-api
