name: Publish DevKit Gateway image

on:
  push:
    branches: [main]
    paths:
      # Gateway-specific source and its image definition.
      - 'gateway/**'
      - 'Dockerfile.gateway'
      # Both applications use the same Gradle wrapper/build configuration.
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - '.dockerignore'
      - '.github/workflows/publish-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dev-kit-gateway:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dev-kit-gateway:main
          cache-from: type=gha,scope=dev-kit-gateway
          cache-to: type=gha,mode=max,scope=dev-kit-gateway
