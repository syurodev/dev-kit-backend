spring:
  application:
    name: dev-kit-gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Client-supplied proxy headers are intentionally not forwarded. Add
          # trusted-proxies explicitly only when a controlled edge proxy exists.
          x-forwarded-request-headers-filter:
            enabled: false
          routes:
            - id: devkit-sync-api
              uri: ${DEVKIT_BACKEND_URL:http://127.0.0.1:8080}
              predicates:
                - Path=/v1/sync/**

server:
  address: ${DEVKIT_GATEWAY_SERVER_ADDRESS:127.0.0.1}
  port: ${DEVKIT_GATEWAY_SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

devkit:
  keycloak:
    issuer: ${DEVKIT_KEYCLOAK_ISSUER:}
    jwk-set-uri: ${DEVKIT_KEYCLOAK_JWK_SET_URI:}
    audience: ${DEVKIT_KEYCLOAK_AUDIENCE:devkit-sync-gateway}
  gateway:
    abuse:
      ip-requests-per-minute: ${DEVKIT_GATEWAY_IP_REQUESTS_PER_MINUTE:120}
      subject-requests-per-minute: ${DEVKIT_GATEWAY_SUBJECT_REQUESTS_PER_MINUTE:300}
      max-concurrent-requests: ${DEVKIT_GATEWAY_MAX_CONCURRENT_REQUESTS:64}
      max-tracked-keys: ${DEVKIT_GATEWAY_MAX_TRACKED_KEYS:10000}
    token:
      issuer: ${DEVKIT_GATEWAY_ISSUER:}
      audience: ${DEVKIT_GATEWAY_AUDIENCE:devkit-sync-api}
      ttl: ${DEVKIT_GATEWAY_TOKEN_TTL:45s}
      key-id: ${DEVKIT_GATEWAY_SIGNING_KEY_ID:devkit-gateway-local}
      private-key-path: ${DEVKIT_GATEWAY_SIGNING_PRIVATE_KEY_PATH:}
      public-key-path: ${DEVKIT_GATEWAY_SIGNING_PUBLIC_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
